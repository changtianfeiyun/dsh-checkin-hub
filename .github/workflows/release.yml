name: release

# Tag a commit with v<version> and the workflow builds the tarball, verifies the
# tag matches package.json, and attaches the asset to a GitHub Release. Anyone
# can then install the published asset directly:
#
#   plugin_manager install_bundle \
#     target=https://github.com/<owner>/dsh-checkin-hub/releases/download/v<version>/local-dsh-checkin-hub-<version>.tgz
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "
            const v = require('./package.json').version;
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (v !== tag) { console.error('tag ' + tag + ' != package.json ' + v); process.exit(1); }
          "

      - name: Build the tarball
        run: node scripts/pack.mjs

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.tgz
          generate_release_notes: true
